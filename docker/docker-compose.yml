version: '3.9'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: lumen_db
    ports:
      - "3307:3306"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    depends_on:
      - mysql
    environment:
      ASPNETCORE_URLS: http://+:5000
    ports:
      - "5000:5000"

  client:
    build:
      context: ../client
      dockerfile: ../docker/Dockerfile.client
    ports:
      - "5173:5173"
    depends_on:
      - server
