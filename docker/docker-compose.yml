version: '3.9'

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: lumen_db
    ports:
      - "3307:3306"
    volumes:
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    depends_on:
      - mysql
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:5000"
